[package]
name = "nanosflow"
description = "Visual scripting for nanos world"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "nanosflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nf-api.workspace = true
nf-project.workspace = true
nf-graph.workspace = true
nf-compiler.workspace = true
nf-server.workspace = true
nf-relay.workspace = true
nf-session.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.18"
