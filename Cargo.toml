[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
nf-api = { path = "crates/nf-api" }
nf-project = { path = "crates/nf-project" }
nf-graph = { path = "crates/nf-graph" }
nf-compiler = { path = "crates/nf-compiler" }
nf-server = { path = "crates/nf-server" }
nf-tunnel = { path = "crates/nf-tunnel" }
nf-relay = { path = "crates/nf-relay" }
nf-session = { path = "crates/nf-session" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
ulid = { version = "1", features = ["serde"] }
tempfile = "3"
bytes = "1"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "io-util", "time", "sync"] }
